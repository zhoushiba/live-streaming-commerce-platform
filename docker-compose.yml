# 直播电商平台 · 一键编排（MySQL + NestJS 后端 + Nginx 前端）
#
# 使用方式：
#   1) 复制环境变量模板：cp .env.example .env（Windows: Copy-Item .env.example .env）
#   2) 按需修改 .env 中的 DB_PASSWORD / JWT_*_SECRET / MOCK_PAY_SECRET
#   3) 启动：docker compose up -d --build
#   4) 前端：http://localhost:8080   后端文档：http://localhost:3000/api/docs
#
# 说明：
# - db 用 MySQL 8，表结构由后端启动时的 Knex 迁移创建（DB_AUTO_MIGRATE=true），
#   同时把 db/schema.mysql.sql 挂载到 MySQL 初始化目录，方便直接用 SQL 建库的部署方式。
# - 后端容器内同时保留 better-sqlite3 依赖，本地开发仍可零依赖跑 sqlite；
#   这里通过 DB_CLIENT=mysql 切到 MySQL，用来演示生产形态（建表 / 事务 / 索引）。
# - 前端是纯静态产物，由 nginx 托管，并把 /api、/media、/uploads、/socket.io 反代到后端。

services:
  db:
    image: mysql:8.0
    container_name: lsc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd_change_me}
      MYSQL_DATABASE: ${DB_NAME:-live_commerce}
      MYSQL_USER: ${DB_USER:-live_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-live_app_pwd}
      TZ: Asia/Shanghai
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root_pwd_change_me}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lsc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DB_CLIENT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-live_app}
      DB_PASSWORD: ${DB_PASSWORD:-live_app_pwd}
      DB_NAME: ${DB_NAME:-live_commerce}
      DB_AUTO_MIGRATE: 'true'
      DB_POOL_MIN: '2'
      DB_POOL_MAX: '10'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_please_change_me_32bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_please_change_me_32bytes}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CACHE_DRIVER: ${CACHE_DRIVER:-memory}
      STREAM_DEMO_MODE: 'true'
      MOCK_PAY_SECRET: ${MOCK_PAY_SECRET:-dev_mock_pay_secret_change_me}
      SEED_ON_BOOT: 'true'
      TZ: Asia/Shanghai
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - backend-storage:/app/storage

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lsc-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  backend-storage:
